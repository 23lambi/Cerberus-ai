<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cerberus</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <button id="new-chat">New chat</button>
    <button id="open-memory">Memory</button>
    <button id="open-documents">Documents</button>
    <button id="open-settings">Settings</button>
    <ul id="chat-list"></ul>
  </aside>

  <main>
    <header>
      <h1>Cerberus</h1>
      <label>
        Model:
        <select id="model"></select>
      </label>
      <label>
        <input type="checkbox" id="three-heads"> Deep think
      </label>
    </header>

    <div id="messages"></div>

    <form id="chat-form">
      <input id="input" placeholder="Say something..." autocomplete="off">
      <button>Send</button>
    </form>
  </main>

  <dialog id="settings-dialog">
    <form id="settings-form">
      <h2>Settings</h2>
      <div id="settings-fields"></div>
      <div class="dialog-buttons">
        <button type="button" id="settings-reset">Reset to defaults</button>
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="memory-dialog">
    <h2>Memory</h2>
    <p class="hint">What Cerberus remembers about you. Everything stays on this computer.</p>
    <form id="memory-add">
      <input id="memory-input" placeholder="Add something to remember..." autocomplete="off">
      <button>Add</button>
    </form>
    <ul id="memory-list"></ul>
    <div class="dialog-buttons">
      <button type="button" id="memory-close">Close</button>
    </div>
  </dialog>

  <dialog id="documents-dialog">
    <h2>Documents</h2>
    <p class="hint">Files Cerberus can read and answer questions about. They stay on this computer.</p>
    <input type="file" id="document-file" multiple accept=".txt,.md,.markdown,.pdf,.csv,.json,.py,.js,.html">
    <p id="document-status" class="hint"></p>
    <ul id="document-list"></ul>
    <div class="dialog-buttons">
      <button type="button" id="documents-close">Close</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/memory.js"></script>
  <script src="/static/documents.js"></script>
</body>
</html>
