name: Feature request
description: Suggest an improvement to Cerberus.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or difficulty you are trying to address.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Cerberus make this easier?
    validations:
      required: true
