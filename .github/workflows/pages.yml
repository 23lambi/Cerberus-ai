name: Website

# Publishes site/ to https://23lambi.github.io/Cerberus-ai/ on every push to
# main that changes it. The screenshots and mascot are copied in from
# docs/assets and static/, so they exist only once in the repository.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/**', 'static/mascot*', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Gather the page and its pictures
        run: |
          mkdir -p public/assets
          cp site/index.html public/
          cp docs/assets/*.png public/assets/
          cp static/mascot.svg static/mascot-idle.svg public/assets/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
