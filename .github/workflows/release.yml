name: Build desktop releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example v0.4.0)
        required: true
        default: v0.4.0
      create_draft:
        description: Create a draft release after all platform builds pass
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      CREATE_DRAFT: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_draft }}
    steps:
      - name: Check version and existing tag before building
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version such as v0.4.1."
            exit 1
          fi
          if [ "$CREATE_DRAFT" != "true" ]; then
            exit 0
          fi
          # A missing ref returns an empty result; authentication/network errors fail.
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$ref" ]; then
            object_sha="$(printf '%s' "$ref" | jq -r '.object.sha')"
            object_type="$(printf '%s' "$ref" | jq -r '.object.type')"
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$ref" ]; then
            object_sha="$(printf '%s' "$ref" | jq -r '.object.sha')"
            object_type="$(printf '%s' "$ref" | jq -r '.object.type')"
            existing_commit="$object_sha"
            if [ "$object_type" = "tag" ]; then
              existing_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.sha)"
            fi
            if [ "$existing_commit" != "$RELEASE_COMMIT" ]; then
              echo "::error::Version $RELEASE_TAG points to $existing_commit; these artifacts were built from $RELEASE_COMMIT. Choose a new version."
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --draft --target "$RELEASE_COMMIT" --title "Cerberus $RELEASE_TAG" \
            --notes-file packaging/release-notes.md
