name: Build desktop releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example v0.4.0)
        required: true
        default: v0.4.0

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            packaging/requirements-*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Linux GUI build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-app.txt pytest==9.1.1
      - name: Python tests
        env:
          CERBERUS_DATA: ${{ runner.temp }}/cerberus-release-tests
        run: python -m pytest -q
      - run: node tests/frontend.test.cjs
      - name: Build and smoke-test the launcher
        shell: bash
        run: python scripts/build_release.py launcher --version "$RELEASE_VERSION"
      - name: Build and smoke-test the application
        shell: bash
        run: python scripts/build_release.py app --version "$RELEASE_VERSION"
      - name: Verify archive installation and data preservation
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python scripts/smoke_installation.py "dist/release/cerberus-$BUILD_TARGET.tar.gz" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble verified downloads
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Create checksummed application manifest
        run: python scripts/release_manifest.py dist/release --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release
          path: dist/release/*
          compression-level: 0

  draft:
    name: Create draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: desktop-release
          path: dist/release
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --draft --verify-tag --title "Cerberus $RELEASE_TAG" \
            --notes-file packaging/release-notes.md
