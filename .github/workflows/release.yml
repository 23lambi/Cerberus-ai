name: Build desktop releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example v0.4.0)
        required: true
        default: v0.4.0
      create_draft:
        description: Create a draft release after all platform builds pass
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      CREATE_DRAFT: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_draft }}
    steps:
      - name: Check version and existing tag before building
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version such as v0.4.1."
            exit 1
          fi
          if [ "$CREATE_DRAFT" != "true" ]; then
            exit 0
          fi
          # Match the full ref so v0.4.1 does not collide with v0.4.10.
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
          ref="$(printf '%s' "$refs" | jq -c --arg name "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $name)')"
          if [ -n "$ref" ]; then
            sha="$(printf '%s' "$ref" | jq -r '.object.sha')"
            type="$(printf '%s' "$ref" | jq -r '.object.type')"
            if [ "$type" = "tag" ]; then sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"; fi
            if [ "$sha" != "$RELEASE_COMMIT" ]; then
              echo "::error::Version $RELEASE_TAG already belongs to commit $sha; this run builds $RELEASE_COMMIT. Choose a new version."
              exit 1
            fi
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            packaging/requirements-*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Linux GUI build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-app.txt pytest==9.1.1
      - name: Python tests
        env:
          CERBERUS_DATA: ${{ runner.temp }}/cerberus-release-tests
        run: python -m pytest -q
      - run: node tests/frontend.test.cjs
      - name: Build and smoke-test the launcher
        shell: bash
        run: python scripts/build_release.py launcher --version "$RELEASE_VERSION"
      - name: Build and smoke-test the application
        shell: bash
        run: python scripts/build_release.py app --version "$RELEASE_VERSION"
      - name: Verify archive installation and data preservation
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python scripts/smoke_installation.py "dist/release/cerberus-$BUILD_TARGET.tar.gz" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  linux-distros:
    # CI builds on Ubuntu. These run the built Linux downloads elsewhere and
    # make them really reach GitHub with their own bundled SSL library, which
    # once looked for certificates only where Ubuntu keeps them.
    name: Release check on ${{ matrix.distro }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora
            image: fedora:latest
            prepare: dnf install -y unzip tar gzip
          - distro: Arch Linux
            image: archlinux:latest
            prepare: pacman -Sy --noconfirm unzip
          - distro: openSUSE
            image: opensuse/tumbleweed:latest
            prepare: zypper --non-interactive install unzip tar gzip
    container: ${{ matrix.image }}
    env:
      CERBERUS_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x86_64
          path: release
      - name: Install archive tools
        run: ${{ matrix.prepare }}
      - name: Launcher reaches GitHub
        run: |
          unzip -q release/cerberus-launcher-linux-x86_64.zip -d launcher
          launcher/CerberusLauncher --check-release
      - name: In-app updater reaches GitHub
        run: |
          mkdir app
          tar -xzf release/cerberus-linux-x86_64.tar.gz -C app
          app/Cerberus/Cerberus --check-release

  assemble:
    name: Assemble verified downloads
    needs: [build, linux-distros]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Create checksummed application manifest
        run: python scripts/release_manifest.py dist/release --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release
          path: dist/release/*
          compression-level: 0

  draft:
    name: Create draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_draft
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: desktop-release
          path: dist/release
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
          ref="$(printf '%s' "$refs" | jq -c --arg name "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $name)')"
          if [ -n "$ref" ]; then
            sha="$(printf '%s' "$ref" | jq -r '.object.sha')"
            type="$(printf '%s' "$ref" | jq -r '.object.type')"
            if [ "$type" = "tag" ]; then sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"; fi
            if [ "$sha" != "$RELEASE_COMMIT" ]; then
              echo "::error::Version $RELEASE_TAG points to $sha; these artifacts were built from $RELEASE_COMMIT. Choose a new version."
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --draft --target "$RELEASE_COMMIT" --title "Cerberus $RELEASE_TAG" \
            --notes-file packaging/release-notes.md
